services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: lexicro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/lexicro
      LEXICRO_MODEL_DIR: /models/analyze-v1
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - /opt/lexicro/models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: