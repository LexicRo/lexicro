services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: lexicro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces the check over TCP. Without it, pg_isready hits
      # the unix socket, which the official image's temporary initdb server
      # (listen_addresses='') answers even though it isn't accepting TCP yet
      # -- so the container can report healthy before port 5432 is actually
      # up, and deploy.sh's migrate.py --apply connects over TCP right after.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      TALLY_WEBHOOK_SECRET: ${TALLY_WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/lexicro
      LEXICRO_MODEL_DIR: /models/analyze-v1
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - /opt/lexicro/models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    # Without this the api container reports a bare `Up` while db reports
    # `Up (healthy)`, so `docker compose ps` cannot say whether the API is
    # actually serving -- which is precisely the question nobody could answer
    # on 2026-08-26. Informational only: nothing depends on this condition.
    #
    # python rather than curl: the base image is python:slim and has no curl,
    # and adding one for a healthcheck would mean an apt layer on every build.
    # urlopen raises on any non-2xx, which is the behaviour wanted.
    #
    # start_period covers model load -- the API reads analyze-v1 off a read-only
    # volume at startup, and failures during that window are not counted, so a
    # slow boot does not flap the container into `unhealthy`.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data: